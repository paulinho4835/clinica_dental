project_id = "dentalsaas"

[api]
enabled = true
port = 56121
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56122
shadow_port = 56120
major_version = 15

[db.pooler]
enabled = true
port = 56129
# Modo transacción: óptimo para serverless (Vercel Fluid Compute) — evita agotar conexiones.
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 200

[studio]
enabled = true
port = 56123

[analytics]
port = 56127

[inbucket]
port = 56124

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Inyecta clinic_id + role en el JWT (ver public.custom_access_token_hook).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[realtime]
enabled = true

[edge_runtime]
enabled = true
