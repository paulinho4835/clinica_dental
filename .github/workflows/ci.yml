name: CI

# Corre en cada push a main y en cada PR. Es la red de seguridad que faltaba:
# con auto-deploy de Vercel, un push con tests rotos llegaba igual a producción.
# Aquí se bloquea antes (typecheck + tests) sin tocar la base de datos.
# (Lint omitido: el proyecto aún no tiene ESLint configurado.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empuja varias veces seguidas, cancela las corridas viejas del mismo ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
